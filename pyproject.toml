[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-news"
version = "0.1.0"
description = "Automate Anthropic article discovery, summarization, audio/video generation, and Bilibili publishing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "biliup>=1.1.29",
  "edge-tts>=7.2,<8",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "imageio-ffmpeg>=0.6,<1",
  "Jinja2>=3.1,<4",
  "Pillow>=12,<13",
  "playwright>=1.54,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
daily-news = "daily_news.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daily_news = ["web/templates/*.html"]
